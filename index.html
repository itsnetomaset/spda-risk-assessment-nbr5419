<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEMAX Engenharia — Análise de Risco PDA · ABNT NBR 5419-2:2026</title>
<style>
/* ============================================================
   NEMAX ENGENHARIA — SISTEMA DE ANÁLISE DE RISCO PDA
   ABNT NBR 5419-2:2026
   Design system: void / night / elevated / volt (dark), alinhado
   ao tema atual de nemaxengenharia.com.br
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* tokens do design system atual do site (nemaxengenharia.com.br) */
  --void: #060608;
  --night: #0a0a0d;
  --elevated: #121216;
  --line: #232329;
  --ink: #f4f4f5;
  --ink-dim: #a1a1aa;
  --ink-faint: #71717a;
  --volt: #f5b301;
  --volt-soft: #ffc933;

  /* nomes de variável originais mantidos (usados em todo o arquivo);
     apenas os VALORES foram remapeados para o tema escuro */
  --navy: var(--ink);            /* era texto de destaque escuro sobre fundo claro; agora texto de destaque claro sobre fundo escuro */
  --navy-dark: var(--void);
  --navy-light: #1a1a20;
  --copper: var(--volt);
  --copper-bright: var(--volt-soft);
  --copper-pale: rgba(245, 179, 1, 0.12);
  --gray-light: #17171c;          /* superfície recuada/hover dentro de cards */
  --gray-mid: #2a2a32;             /* divisor médio / fundo de chip */
  --gray-dark: var(--ink);
  --gray-text: var(--ink-dim);
  --ok: #34d399;
  --ok-bg: rgba(52, 211, 153, 0.12);
  --fail: #f87171;
  --fail-bg: rgba(248, 113, 113, 0.12);
  --warn: #fb923c;
  --warn-bg: rgba(251, 146, 60, 0.12);
  --line: #232329;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.3);
}

body {
  font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--void);
  color: var(--gray-dark);
  font-size: 14px;
  line-height: 1.5;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ============== TOPBAR ============== */
.topbar {
  background: var(--night);
  color: #fff;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--line);
}
.topbar-brand { display: flex; flex-direction: column; line-height: 1; cursor: pointer; }
.topbar-brand-top { display: flex; align-items: baseline; gap: 1px; }
.topbar-brand-nema { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.02em; color: var(--ink); }
.topbar-brand-x { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 22px; color: var(--volt); }
.topbar-brand-sub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.22em; margin-top: 1px; }
.topbar-nav { display: flex; gap: 4px; }
.topbar-nav button {
  background: transparent; border: none; color: var(--ink-dim); padding: 8px 14px;
  border-radius: 6px; font-size: 13.5px; font-weight: 500; transition: 0.15s;
}
.topbar-nav button:hover { background: rgba(255,255,255,0.06); color: var(--ink); }
.topbar-nav button.active { background: var(--volt); color: var(--void); }
.topbar-right { display: none; align-items: center; gap: 14px; font-size: 12.5px; color: var(--ink-faint); }

/* ============== LAYOUT ============== */
.app-wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; }
.hidden { display: none !important; }

/* ============== DASHBOARD ============== */
.dash-header { margin-bottom: 28px; }
.dash-title { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.dash-sub { color: var(--gray-text); font-size: 14.5px; }

.dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.dash-card {
  background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; cursor: pointer; transition: 0.15s; box-shadow: var(--shadow);
}
.dash-card:hover { border-color: var(--copper); transform: translateY(-1px); }
.dash-card-icon { font-size: 22px; margin-bottom: 10px; }
.dash-card-title { font-weight: 700; font-size: 15px; color: var(--navy); margin-bottom: 4px; }
.dash-card-desc { font-size: 12.5px; color: var(--gray-text); }

.dash-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.stat-box { background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.stat-num { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 800; color: var(--navy); }
.stat-label { font-size: 12px; color: var(--gray-text); margin-top: 2px; }

.section-title { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; color: var(--navy); margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }

.hist-table { width: 100%; border-collapse: collapse; background: var(--elevated); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.hist-table th { background: var(--gray-light); text-align: left; padding: 10px 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gray-text); border-bottom: 1px solid var(--line); }
.hist-table td { padding: 12px 14px; border-bottom: 1px solid var(--gray-mid); font-size: 13.5px; }
.hist-table tr:last-child td { border-bottom: none; }
.hist-table tr:hover { background: var(--gray-light); }
.hist-empty { padding: 40px; text-align: center; color: var(--gray-text); }

.pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.fail { background: var(--fail-bg); color: var(--fail); }
.pill.pending { background: var(--gray-mid); color: var(--gray-text); }

.row-actions { display: flex; gap: 6px; }
.icon-btn {
  background: var(--gray-light); border: 1px solid var(--line); border-radius: 5px;
  padding: 5px 9px; font-size: 12px; color: var(--gray-text);
}
.icon-btn:hover { background: var(--gray-mid); }
.icon-btn.danger:hover { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }

/* ============== WIZARD ============== */
.wizard-shell { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
.wizard-nav {
  background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px; position: sticky; top: 84px; box-shadow: var(--shadow);
  max-height: calc(100vh - 110px); overflow-y: auto;
}
.wnav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: var(--gray-text); margin-bottom: 2px;
}
.wnav-item:hover { background: var(--gray-light); }
.wnav-item.active { background: var(--gray-light); color: var(--volt); font-weight: 600; }
.wnav-num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--gray-mid); color: var(--gray-text);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.wnav-item.active .wnav-num { background: var(--copper); color: var(--void); }
.wnav-item.done .wnav-num { background: var(--ok); color: var(--void); }

.wizard-panel { background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-height: 560px; display: flex; flex-direction: column; }
.wpanel-header { padding: 22px 28px; border-bottom: 1px solid var(--line); }
.wpanel-kicker { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--copper); font-weight: 700; margin-bottom: 4px; }
.wpanel-title { font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 700; color: var(--navy); }
.wpanel-body { padding: 24px 28px; flex: 1; }
.wpanel-footer { padding: 16px 28px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }

.field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 20px; }
.field-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.field-grid.cols-1 { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.span-2 { grid-column: span 2; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--navy); }
.field .hint { font-size: 11px; color: var(--gray-text); font-weight: 400; font-style: italic; }
.field input[type=text], .field input[type=number], .field input[type=email], .field input[type=tel],
.field input[type=date], .field select, .field textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; font-size: 13.5px; color: var(--gray-dark); background: var(--night);
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--copper); box-shadow: 0 0 0 3px rgba(245,179,1,0.14); }
.field textarea { resize: vertical; min-height: 60px; }

.checkbox-row { display: flex; align-items: center; gap: 9px; padding: 8px 0; }
.checkbox-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--copper); }
.checkbox-row label { font-size: 13.5px; color: var(--gray-dark); cursor: pointer; }

.btn { border: none; border-radius: 7px; padding: 10px 20px; font-size: 13.5px; font-weight: 600; transition: 0.15s; }
.btn-primary { background: var(--copper); color: var(--void); }
.btn-primary:hover { background: var(--copper-bright); }
.btn-secondary { background: var(--gray-light); color: var(--gray-dark); border: 1px solid var(--line); }
.btn-secondary:hover { background: var(--gray-mid); }
.btn-ghost { background: transparent; color: var(--gray-text); }
.btn-ghost:hover { color: var(--navy); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.subsection { margin-bottom: 26px; }
.subsection-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.subsection-title::before { content: ''; width: 3px; height: 14px; background: var(--copper); display: inline-block; }

.repeat-block { border: 1px solid var(--line); border-radius: 7px; padding: 16px; margin-bottom: 12px; position: relative; background: var(--gray-light); }
.repeat-remove { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--fail); font-size: 16px; font-weight: 700; }

.tag-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.source-card {
  border: 2px solid var(--line); border-radius: 8px; padding: 16px; cursor: pointer; transition: 0.15s;
}
.source-card.active { border-color: var(--copper); background: var(--copper-pale); }
.source-card-title { font-weight: 700; font-size: 14px; color: var(--navy); margin-bottom: 4px; }
.source-card-desc { font-size: 12px; color: var(--gray-text); line-height: 1.5; }

/* ============== RESULTADOS ============== */
.verdict-banner { border-radius: 10px; padding: 22px 26px; margin-bottom: 22px; border: 1px solid; }
.verdict-banner.ok { background: var(--ok-bg); border-color: rgba(52,211,153,0.35); }
.verdict-banner.fail { background: var(--fail-bg); border-color: rgba(248,113,113,0.35); }
.verdict-banner-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-bottom: 6px; }
.verdict-banner.ok .verdict-banner-label { color: var(--ok); }
.verdict-banner.fail .verdict-banner-label { color: var(--fail); }
.verdict-banner-main { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.verdict-banner.ok .verdict-banner-main { color: var(--ok); }
.verdict-banner.fail .verdict-banner-main { color: var(--fail); }
.verdict-banner-detail { font-size: 13px; color: var(--gray-text); line-height: 1.6; }

.risk-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.risk-card { border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
.risk-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.risk-card-name { font-size: 13.5px; font-weight: 700; color: var(--navy); }
.risk-card-val { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 700; color: var(--gray-dark); margin-bottom: 4px; }
.risk-card-tol { font-size: 11.5px; color: var(--gray-text); }
.risk-bar-track { height: 6px; background: var(--gray-mid); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.risk-bar-fill { height: 100%; border-radius: 4px; }

.calc-memory-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.calc-memory-table th { text-align: left; padding: 8px 10px; background: var(--gray-light); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gray-text); border-bottom: 1px solid var(--line); }
.calc-memory-table td { padding: 9px 10px; border-bottom: 1px solid var(--gray-mid); vertical-align: top; }
.calc-memory-table .cm-norma { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--copper); white-space: nowrap; }
.calc-memory-table .cm-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--gray-dark); }
.calc-memory-group-title { font-weight: 700; color: var(--navy); font-size: 13px; margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.calc-memory-group-title:first-child { border-top: none; margin-top: 0; }

.protection-card { border-left: 4px solid var(--copper); background: var(--gray-light); border-radius: 6px; padding: 16px 18px; margin-bottom: 12px; }
.protection-card-title { font-weight: 700; color: var(--navy); font-size: 13.5px; margin-bottom: 6px; }
.protection-card-desc { font-size: 12.5px; color: var(--gray-text); line-height: 1.6; }
.protection-card-norma { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--copper); margin-top: 6px; }

/* ============== TOAST ============== */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--elevated); border: 1px solid var(--line); color: var(--ink); padding: 13px 20px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 1000; opacity: 0; transform: translateY(10px); transition: 0.25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

/* ============== PRINT / RELATÓRIO ==============
   O laudo impresso/PDF permanece em papel claro (padrão ABNT), independente
   do tema escuro da interface — mantém legibilidade e economia de tinta
   na impressão real. */
#print-report { display: none; }
@media print {
  body * { visibility: hidden; }
  #print-report, #print-report * { visibility: visible; }
  #print-report { display: block !important; position: absolute; top: 0; left: 0; width: 100%; }
  .no-print { display: none !important; }
  /* Por padrão, ao gerar PDF via "Salvar como PDF" no diálogo de impressão
     do navegador (Ctrl+P), cores de fundo são desligadas a menos que o
     usuário marque manualmente "Gráficos de plano de fundo" — isso deixa a
     capa (fundo escuro) branca, com o texto claro ilegível por cima.
     print-color-adjust força a impressão da cor de fundo sempre, sem
     depender dessa configuração manual do usuário. */
  #print-report * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
}

.report-page { width: 210mm; margin: 0 auto; padding: 0; font-family: Arial, Helvetica, sans-serif; color: #1f2329; font-size: 11pt; line-height: 1.5; }
.report-cover { background: var(--void); color: #fff; padding: 60px 50px; min-height: 297mm; display: flex; flex-direction: column; }
.report-cover-brand { font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 800; margin-bottom: 2px; }
.report-cover-brand .x-accent { color: var(--copper-bright); }
.report-cover-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--ink-dim); margin-bottom: 60px; }
.report-cover-title { font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.3; max-width: 600px; margin-top: auto; margin-bottom: 20px; }
.report-cover-meta { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-dim); line-height: 2; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 20px; }

/* Padrão ABNT — fluxo contínuo de texto entre seções, com quebra de página
   apenas em pontos estratégicos explícitos (.report-page-break), não em toda
   .report-section indiscriminadamente. Isso evita tanto títulos "órfãos" no
   fim de uma página (separados do próprio conteúdo) quanto espaços em branco
   desperdiçados quando uma seção termina cedo numa página.

   Margens ABNT NBR 14724 (3cm superior/esquerda, 2cm inferior/direita)
   aplicadas como padding em mm diretamente no conteúdo (box model normal),
   em vez de via @page margin — a combinação de @page margin com viewport
   customizada do motor de impressão causava corte real de texto nas bordas
   (largura de layout calculada antes da margem ser descontada). @page margin
   abaixo fica pequena, só como folga de segurança física da impressora. */
.report-section { padding: 0 20mm 0 30mm; }
.report-section:first-of-type { padding-top: 15mm; }
.report-page-break { page-break-before: always; }
.report-h2 {
  font-size: 16pt; font-weight: 700; color: #1a1a1f;
  border-bottom: 2px solid var(--copper); padding-bottom: 8px;
  margin-top: 20px; margin-bottom: 16px;
  page-break-after: avoid; /* nunca deixa o título sozinho no fim da página */
  break-after: avoid;
}
.report-section:first-of-type .report-h2:first-child { margin-top: 0; }
.report-page p { margin-bottom: 10px; orphans: 3; widows: 3; }
.report-table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-bottom: 18px; font-size: 10.5pt; }
.report-table thead { display: table-header-group; } /* repete cabeçalho em cada página, quando a tabela atravessa quebra */
.report-table tr { page-break-inside: avoid; break-inside: avoid; } /* nunca corta uma linha ao meio */
.report-table th { text-align: left; background: #f2f2f4; padding: 7px 10px; font-weight: 700; border: 1px solid #d8dde5; word-wrap: break-word; overflow-wrap: break-word; }
.report-table td { padding: 7px 10px; border: 1px solid #d8dde5; word-wrap: break-word; overflow-wrap: break-word; }
/* Tabelas curtas (cabeçalho/resumo) cabem inteiras numa página sempre que
   possível; tabelas longas (memória de cálculo) usam table-header-group
   acima e fluem naturalmente por várias páginas. */
.report-table.report-table-compact { page-break-inside: avoid; break-inside: avoid; }
.subsection { page-break-inside: avoid; break-inside: avoid; }
.report-sig { margin-top: 40px; padding-top: 10px; width: 320px; font-size: 12.5px; page-break-inside: avoid; break-inside: avoid; }

@page {
  size: A4;
  margin: 12mm 0 0 0; /* margem lateral/inferior zerada propositalmente — a largura de .report-page já é 210mm (folha cheia); só uma margem superior pequena para caber a numeração de página */
  @top-right { content: "Página " counter(page) " de " counter(pages); font-family: Arial, sans-serif; font-size: 9pt; color: #666; margin-right: 8mm; }
}
@page :first {
  margin: 0; /* capa em sangria total, sem numeração */
  @top-right { content: ""; }
}

/* ============== RESPONSIVO ============== */
@media (max-width: 880px) {
  .wizard-shell { grid-template-columns: 1fr; }
  .wizard-nav { position: relative; top: 0; max-height: none; display: flex; overflow-x: auto; gap: 4px; }
  .wnav-item { flex-shrink: 0; }
  .field-grid, .field-grid.cols-3 { grid-template-columns: 1fr; }
  .dash-grid, .dash-stats { grid-template-columns: repeat(2, 1fr); }
  .risk-cards { grid-template-columns: 1fr; }
  .topbar { padding: 0 12px; height: auto; flex-wrap: wrap; }
  .topbar-nav { order: 3; width: 100%; overflow-x: auto; padding: 6px 0 10px; gap: 2px; }
  .topbar-nav button { flex-shrink: 0; padding: 7px 11px; font-size: 12.5px; }
  .topbar-right { display: none; }
  .app-wrap { padding: 18px 14px 60px; }
}
</style>
</head>

<div class="topbar no-print">
  <div class="topbar-brand" onclick="window.location.href='https://nemaxengenharia.com.br/'" style="cursor:pointer;">
    <img src="./assets/nemax-logo-v2.png" alt="NEMAX Engenharia" style="height:44px;width:auto;display:block;">
  </div>
  <div class="topbar-nav">
    <button id="nav-dashboard" onclick="App.goDashboard()">Dashboard</button>
    <button id="nav-nova" onclick="App.novaAnalise()">Nova análise</button>
    <button id="nav-historico" onclick="App.goHistorico()">Histórico</button>
    <button id="nav-config" onclick="App.goConfig()">Configurações</button>
  </div>
  <div class="topbar-right">
    <span id="empresa-nome-topo">NEMAX Engenharia</span>
  </div>
</div>

<div class="app-wrap" id="app-wrap">
  <!-- Conteúdo injetado via JS -->
</div>

<div class="toast" id="toast"></div>

<div id="print-report"></div>

<script type="module" src="src/main.js"></script>
<script defer src="js/app.js"></script>

</body>
