<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEMAX Engenharia — Análise de Risco PDA · ABNT NBR 5419-2:2026</title>
<style>
/* ============================================================
   NEMAX ENGENHARIA — SISTEMA DE ANÁLISE DE RISCO PDA
   ABNT NBR 5419-2:2026
   Design system: void / night / elevated / volt (dark), alinhado
   ao tema atual de nemaxengenharia.com.br
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* tokens do design system atual do site (nemaxengenharia.com.br) */
  --void: #060608;
  --night: #0a0a0d;
  --elevated: #121216;
  --line: #232329;
  --ink: #f4f4f5;
  --ink-dim: #a1a1aa;
  --ink-faint: #71717a;
  --volt: #f5b301;
  --volt-soft: #ffc933;

  /* nomes de variável originais mantidos (usados em todo o arquivo);
     apenas os VALORES foram remapeados para o tema escuro */
  --navy: var(--ink);            /* era texto de destaque escuro sobre fundo claro; agora texto de destaque claro sobre fundo escuro */
  --navy-dark: var(--void);
  --navy-light: #1a1a20;
  --copper: var(--volt);
  --copper-bright: var(--volt-soft);
  --copper-pale: rgba(245, 179, 1, 0.12);
  --gray-light: #17171c;          /* superfície recuada/hover dentro de cards */
  --gray-mid: #2a2a32;             /* divisor médio / fundo de chip */
  --gray-dark: var(--ink);
  --gray-text: var(--ink-dim);
  --ok: #34d399;
  --ok-bg: rgba(52, 211, 153, 0.12);
  --fail: #f87171;
  --fail-bg: rgba(248, 113, 113, 0.12);
  --warn: #fb923c;
  --warn-bg: rgba(251, 146, 60, 0.12);
  --line: #232329;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.3);
}

body {
  font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--void);
  color: var(--gray-dark);
  font-size: 14px;
  line-height: 1.5;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ============== TOPBAR ============== */
.topbar {
  background: var(--night);
  color: #fff;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--line);
}
.topbar-brand { display: flex; flex-direction: column; line-height: 1; cursor: pointer; }
.topbar-brand-top { display: flex; align-items: baseline; gap: 1px; }
.topbar-brand-nema { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.02em; color: var(--ink); }
.topbar-brand-x { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 22px; color: var(--volt); }
.topbar-brand-sub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.22em; margin-top: 1px; }
.topbar-nav { display: flex; gap: 4px; }
.topbar-nav button {
  background: transparent; border: none; color: var(--ink-dim); padding: 8px 14px;
  border-radius: 6px; font-size: 13.5px; font-weight: 500; transition: 0.15s;
}
.topbar-nav button:hover { background: rgba(255,255,255,0.06); color: var(--ink); }
.topbar-nav button.active { background: var(--volt); color: var(--void); }
.topbar-right { display: none; align-items: center; gap: 14px; font-size: 12.5px; color: var(--ink-faint); }

/* ============== LAYOUT ============== */
.app-wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; }
.hidden { display: none !important; }

/* ============== DASHBOARD ============== */
.dash-header { margin-bottom: 28px; }
.dash-title { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.dash-sub { color: var(--gray-text); font-size: 14.5px; }

.dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.dash-card {
  background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; cursor: pointer; transition: 0.15s; box-shadow: var(--shadow);
}
.dash-card:hover { border-color: var(--copper); transform: translateY(-1px); }
.dash-card-icon { font-size: 22px; margin-bottom: 10px; }
.dash-card-title { font-weight: 700; font-size: 15px; color: var(--navy); margin-bottom: 4px; }
.dash-card-desc { font-size: 12.5px; color: var(--gray-text); }

.dash-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.stat-box { background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.stat-num { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 800; color: var(--navy); }
.stat-label { font-size: 12px; color: var(--gray-text); margin-top: 2px; }

.section-title { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; color: var(--navy); margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }

.hist-table { width: 100%; border-collapse: collapse; background: var(--elevated); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.hist-table th { background: var(--gray-light); text-align: left; padding: 10px 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gray-text); border-bottom: 1px solid var(--line); }
.hist-table td { padding: 12px 14px; border-bottom: 1px solid var(--gray-mid); font-size: 13.5px; }
.hist-table tr:last-child td { border-bottom: none; }
.hist-table tr:hover { background: var(--gray-light); }
.hist-empty { padding: 40px; text-align: center; color: var(--gray-text); }

.pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.fail { background: var(--fail-bg); color: var(--fail); }
.pill.pending { background: var(--gray-mid); color: var(--gray-text); }

.row-actions { display: flex; gap: 6px; }
.icon-btn {
  background: var(--gray-light); border: 1px solid var(--line); border-radius: 5px;
  padding: 5px 9px; font-size: 12px; color: var(--gray-text);
}
.icon-btn:hover { background: var(--gray-mid); }
.icon-btn.danger:hover { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }

/* ============== WIZARD ============== */
.wizard-shell { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
.wizard-nav {
  background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px; position: sticky; top: 84px; box-shadow: var(--shadow);
  max-height: calc(100vh - 110px); overflow-y: auto;
}
.wnav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: var(--gray-text); margin-bottom: 2px;
}
.wnav-item:hover { background: var(--gray-light); }
.wnav-item.active { background: var(--gray-light); color: var(--volt); font-weight: 600; }
.wnav-num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--gray-mid); color: var(--gray-text);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.wnav-item.active .wnav-num { background: var(--copper); color: var(--void); }
.wnav-item.done .wnav-num { background: var(--ok); color: var(--void); }

.wizard-panel { background: var(--elevated); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-height: 560px; display: flex; flex-direction: column; }
.wpanel-header { padding: 22px 28px; border-bottom: 1px solid var(--line); }
.wpanel-kicker { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--copper); font-weight: 700; margin-bottom: 4px; }
.wpanel-title { font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 700; color: var(--navy); }
.wpanel-body { padding: 24px 28px; flex: 1; }
.wpanel-footer { padding: 16px 28px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }

.field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 20px; }
.field-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.field-grid.cols-1 { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.span-2 { grid-column: span 2; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--navy); }
.field .hint { font-size: 11px; color: var(--gray-text); font-weight: 400; font-style: italic; }
.field input[type=text], .field input[type=number], .field input[type=email], .field input[type=tel],
.field input[type=date], .field select, .field textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; font-size: 13.5px; color: var(--gray-dark); background: var(--night);
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--copper); box-shadow: 0 0 0 3px rgba(245,179,1,0.14); }
.field textarea { resize: vertical; min-height: 60px; }

.checkbox-row { display: flex; align-items: center; gap: 9px; padding: 8px 0; }
.checkbox-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--copper); }
.checkbox-row label { font-size: 13.5px; color: var(--gray-dark); cursor: pointer; }

.btn { border: none; border-radius: 7px; padding: 10px 20px; font-size: 13.5px; font-weight: 600; transition: 0.15s; }
.btn-primary { background: var(--copper); color: var(--void); }
.btn-primary:hover { background: var(--copper-bright); }
.btn-secondary { background: var(--gray-light); color: var(--gray-dark); border: 1px solid var(--line); }
.btn-secondary:hover { background: var(--gray-mid); }
.btn-ghost { background: transparent; color: var(--gray-text); }
.btn-ghost:hover { color: var(--navy); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.subsection { margin-bottom: 26px; }
.subsection-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.subsection-title::before { content: ''; width: 3px; height: 14px; background: var(--copper); display: inline-block; }

.repeat-block { border: 1px solid var(--line); border-radius: 7px; padding: 16px; margin-bottom: 12px; position: relative; background: var(--gray-light); }
.repeat-remove { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--fail); font-size: 16px; font-weight: 700; }

.tag-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.source-card {
  border: 2px solid var(--line); border-radius: 8px; padding: 16px; cursor: pointer; transition: 0.15s;
}
.source-card.active { border-color: var(--copper); background: var(--copper-pale); }
.source-card-title { font-weight: 700; font-size: 14px; color: var(--navy); margin-bottom: 4px; }
.source-card-desc { font-size: 12px; color: var(--gray-text); line-height: 1.5; }

/* ============== RESULTADOS ============== */
.verdict-banner { border-radius: 10px; padding: 22px 26px; margin-bottom: 22px; border: 1px solid; }
.verdict-banner.ok { background: var(--ok-bg); border-color: rgba(52,211,153,0.35); }
.verdict-banner.fail { background: var(--fail-bg); border-color: rgba(248,113,113,0.35); }
.verdict-banner-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-bottom: 6px; }
.verdict-banner.ok .verdict-banner-label { color: var(--ok); }
.verdict-banner.fail .verdict-banner-label { color: var(--fail); }
.verdict-banner-main { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.verdict-banner.ok .verdict-banner-main { color: var(--ok); }
.verdict-banner.fail .verdict-banner-main { color: var(--fail); }
.verdict-banner-detail { font-size: 13px; color: var(--gray-text); line-height: 1.6; }

.risk-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.risk-card { border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
.risk-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.risk-card-name { font-size: 13.5px; font-weight: 700; color: var(--navy); }
.risk-card-val { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 700; color: var(--gray-dark); margin-bottom: 4px; }
.risk-card-tol { font-size: 11.5px; color: var(--gray-text); }
.risk-bar-track { height: 6px; background: var(--gray-mid); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.risk-bar-fill { height: 100%; border-radius: 4px; }

.calc-memory-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.calc-memory-table th { text-align: left; padding: 8px 10px; background: var(--gray-light); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gray-text); border-bottom: 1px solid var(--line); }
.calc-memory-table td { padding: 9px 10px; border-bottom: 1px solid var(--gray-mid); vertical-align: top; }
.calc-memory-table .cm-norma { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--copper); white-space: nowrap; }
.calc-memory-table .cm-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--gray-dark); }
.calc-memory-group-title { font-weight: 700; color: var(--navy); font-size: 13px; margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.calc-memory-group-title:first-child { border-top: none; margin-top: 0; }

.protection-card { border-left: 4px solid var(--copper); background: var(--gray-light); border-radius: 6px; padding: 16px 18px; margin-bottom: 12px; }
.protection-card-title { font-weight: 700; color: var(--navy); font-size: 13.5px; margin-bottom: 6px; }
.protection-card-desc { font-size: 12.5px; color: var(--gray-text); line-height: 1.6; }
.protection-card-norma { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--copper); margin-top: 6px; }

/* ============== TOAST ============== */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--elevated); border: 1px solid var(--line); color: var(--ink); padding: 13px 20px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 1000; opacity: 0; transform: translateY(10px); transition: 0.25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

/* ============== PRINT / RELATÓRIO ==============
   O laudo impresso/PDF permanece em papel claro (padrão ABNT), independente
   do tema escuro da interface — mantém legibilidade e economia de tinta
   na impressão real. */
#print-report { display: none; }
@media print {
  body * { visibility: hidden; }
  #print-report, #print-report * { visibility: visible; }
  #print-report { display: block !important; position: absolute; top: 0; left: 0; width: 100%; }
  .no-print { display: none !important; }
  /* Por padrão, ao gerar PDF via "Salvar como PDF" no diálogo de impressão
     do navegador (Ctrl+P), cores de fundo são desligadas a menos que o
     usuário marque manualmente "Gráficos de plano de fundo" — isso deixa a
     capa (fundo escuro) branca, com o texto claro ilegível por cima.
     print-color-adjust força a impressão da cor de fundo sempre, sem
     depender dessa configuração manual do usuário. */
  #print-report * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
}

.report-page { width: 210mm; margin: 0 auto; padding: 0; font-family: Arial, Helvetica, sans-serif; color: #1f2329; font-size: 11pt; line-height: 1.5; }
.report-cover { background: var(--void); color: #fff; padding: 60px 50px; min-height: 297mm; display: flex; flex-direction: column; }
.report-cover-brand { font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 800; margin-bottom: 2px; }
.report-cover-brand .x-accent { color: var(--copper-bright); }
.report-cover-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--ink-dim); margin-bottom: 60px; }
.report-cover-title { font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.3; max-width: 600px; margin-top: auto; margin-bottom: 20px; }
.report-cover-meta { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-dim); line-height: 2; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 20px; }

/* Padrão ABNT — fluxo contínuo de texto entre seções, com quebra de página
   apenas em pontos estratégicos explícitos (.report-page-break), não em toda
   .report-section indiscriminadamente. Isso evita tanto títulos "órfãos" no
   fim de uma página (separados do próprio conteúdo) quanto espaços em branco
   desperdiçados quando uma seção termina cedo numa página.

   Margens ABNT NBR 14724 (3cm superior/esquerda, 2cm inferior/direita)
   aplicadas como padding em mm diretamente no conteúdo (box model normal),
   em vez de via @page margin — a combinação de @page margin com viewport
   customizada do motor de impressão causava corte real de texto nas bordas
   (largura de layout calculada antes da margem ser descontada). @page margin
   abaixo fica pequena, só como folga de segurança física da impressora. */
.report-section { padding: 0 20mm 0 30mm; }
.report-section:first-of-type { padding-top: 15mm; }
.report-page-break { page-break-before: always; }
.report-h2 {
  font-size: 16pt; font-weight: 700; color: #1a1a1f;
  border-bottom: 2px solid var(--copper); padding-bottom: 8px;
  margin-top: 20px; margin-bottom: 16px;
  page-break-after: avoid; /* nunca deixa o título sozinho no fim da página */
  break-after: avoid;
}
.report-section:first-of-type .report-h2:first-child { margin-top: 0; }
.report-page p { margin-bottom: 10px; orphans: 3; widows: 3; }
.report-table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-bottom: 18px; font-size: 10.5pt; }
.report-table thead { display: table-header-group; } /* repete cabeçalho em cada página, quando a tabela atravessa quebra */
.report-table tr { page-break-inside: avoid; break-inside: avoid; } /* nunca corta uma linha ao meio */
.report-table th { text-align: left; background: #f2f2f4; padding: 7px 10px; font-weight: 700; border: 1px solid #d8dde5; word-wrap: break-word; overflow-wrap: break-word; }
.report-table td { padding: 7px 10px; border: 1px solid #d8dde5; word-wrap: break-word; overflow-wrap: break-word; }
/* Tabelas curtas (cabeçalho/resumo) cabem inteiras numa página sempre que
   possível; tabelas longas (memória de cálculo) usam table-header-group
   acima e fluem naturalmente por várias páginas. */
.report-table.report-table-compact { page-break-inside: avoid; break-inside: avoid; }
.subsection { page-break-inside: avoid; break-inside: avoid; }
.report-sig { margin-top: 40px; padding-top: 10px; width: 320px; font-size: 12.5px; page-break-inside: avoid; break-inside: avoid; }

@page {
  size: A4;
  margin: 12mm 0 0 0; /* margem lateral/inferior zerada propositalmente — a largura de .report-page já é 210mm (folha cheia); só uma margem superior pequena para caber a numeração de página */
  @top-right { content: "Página " counter(page) " de " counter(pages); font-family: Arial, sans-serif; font-size: 9pt; color: #666; margin-right: 8mm; }
}
@page :first {
  margin: 0; /* capa em sangria total, sem numeração */
  @top-right { content: ""; }
}

/* ============== RESPONSIVO ============== */
@media (max-width: 880px) {
  .wizard-shell { grid-template-columns: 1fr; }
  .wizard-nav { position: relative; top: 0; max-height: none; display: flex; overflow-x: auto; gap: 4px; }
  .wnav-item { flex-shrink: 0; }
  .field-grid, .field-grid.cols-3 { grid-template-columns: 1fr; }
  .dash-grid, .dash-stats { grid-template-columns: repeat(2, 1fr); }
  .risk-cards { grid-template-columns: 1fr; }
  .topbar { padding: 0 12px; height: auto; flex-wrap: wrap; }
  .topbar-nav { order: 3; width: 100%; overflow-x: auto; padding: 6px 0 10px; gap: 2px; }
  .topbar-nav button { flex-shrink: 0; padding: 7px 11px; font-size: 12.5px; }
  .topbar-right { display: none; }
  .app-wrap { padding: 18px 14px 60px; }
}
</style>

<script>
/* ============================================================

        norma: "ABNT NBR 5419-3:2026, Anexo C, C.3.4, Figura C.7, C.3.4.1",
        substituicao: `Fórmula válida apenas para n ≥ 4 condutores de descida (informado: n = ${n}). Para 1, 2 ou 3 descidas, use os casos específicos (Figuras C.3 a C.6).`,
      };
    }
    const cFora = c < 3 || c > 20;
    const hFora = h < 3 || h > 20;
    const value = 1 / (2 * n) + 0.1 + 0.2 * Math.cbrt(c / h);
    return {
      value, aplicavel: true,
      avisoFaixa: cFora || hFora,
      formula: "kc = 1/(2n) + 0,1 + 0,2×∛(c/h)",
      norma: "ABNT NBR 5419-3:2026, Anexo C, C.3.4, Figura C.7, C.3.4.1",
      substituicao: `kc = 1/(2×${n}) + 0,1 + 0,2×∛(${c}/${h}) = ${value.toFixed(3)}${(cFora || hFora) ? " — ATENÇÃO: a norma assume h e c entre 3 m e 20 m (C.3.4.1); valor(es) informado(s) fora dessa faixa, resultado é aproximação extrapolada." : ""} (aproximação para estruturas cúbicas, n ≥ 4 — C.3.4.1)`,
    };
  }

  /* ==========================================================================
     6.3.1 / 6.3.2 — Distância de segurança "s"
     Norma: 6.3.1.2 (Equação 4, completa) e 6.3.2 (Equação 5, simplificada)
     ========================================================================== */
  function calc_distanciaSeguranca_simplificada(NP, meio, kc, l) {
    const ki = TABELA11_KI[NP];
    const km = TABELA12_KM[meio];
    const value = (ki / km) * kc * l;
    return {
      value,
      formula: "s = (ki / km) × kc × l",
      norma: "ABNT NBR 5419-3:2026, 6.3.2, Equação (5)",
      substituicao: `s = (${ki} / ${km}) × ${kc.toFixed(3)} × ${l} = ${value.toFixed(3)} m`,
      ki, km, kc, l,
    };
  }

  function calc_distanciaSeguranca_completa(NP, meio, termos) {
    // termos: array de {kc, l} — soma de kc_i × l_i para cada trecho
    const ki = TABELA11_KI[NP];
    const km = TABELA12_KM[meio];
    const soma = termos.reduce((acc, t) => acc + t.kc * t.l, 0);
    const value = (ki / km) * soma;
    const termosTexto = termos.map((t, i) => `kc${i + 1}×l${i + 1} (${t.kc.toFixed(3)}×${t.l})`).join(" + ");
    return {
      value,
      formula: "s = (ki / km) × (kc1×l1 + kc2×l2 + ... + kcn×ln)",
      norma: "ABNT NBR 5419-3:2026, 6.3.1.2, Equação (4)",
      substituicao: `s = (${ki} / ${km}) × [${termosTexto}] = (${ki} / ${km}) × ${soma.toFixed(3)} = ${value.toFixed(3)} m`,
      ki, km, soma,
    };
  }

  /* ==========================================================================
     ANEXO B — Seção mínima da blindagem da linha elétrica
     Norma: B.2, Equação sem número (Scmín), e B.4 (limites de corrente)
     ========================================================================== */
  function calc_secaoMinBlindagem(IF, rhoC, Lc, Uw) {
    // Scmín (mm²) = (IF × rhoC × Lc × 10^6) / Uw
    // IF em kA, rhoC em Ω·m, Lc em m, Uw em kV -> Scmín em mm²
    const value = (IF * rhoC * Lc * 1e6) / Uw;
    return {
      value,
      formula: "Scmín = (IF × ρc × Lc × 10⁶) / Uw",
      norma: "ABNT NBR 5419-3:2026, Anexo B, B.2",
      substituicao: `Scmín = (${IF} × ${rhoC} × ${Lc} × 10⁶) / ${Uw} = ${value.toFixed(2)} mm²`,
    };
  }

  function calc_comprimentoLinhaBlindagem_aterrada(rhoSolo) {
    const value = 8 * Math.sqrt(rhoSolo);
    return {
      value,
      formula: "Lc ≤ 8×√ρ (blindagem em contato com o solo)",
      norma: "ABNT NBR 5419-3:2026, Anexo B, Tabela B.1",
      substituicao: `Lc ≤ 8×√${rhoSolo} = ${value.toFixed(2)} m`,
    };
  }

  function calc_correnteLimiteBlindagemCobre(Sc) {
    const value = 8 * Sc;
    return {
      value,
      formula: "IF = 8 × Sc (limite de elevação de temperatura aceitável — blindagem em cobre)",
      norma: "ABNT NBR 5419-3:2026, Anexo B, B.4-a)",
      substituicao: `IF = 8 × ${Sc} = ${value.toFixed(2)} kA`,
    };
  }

  function calc_correnteLimiteCondutoresNaoBlindados(nLinhas, ScCadaUm) {
    const value = 8 * nLinhas * ScCadaUm;
    return {
      value,
      formula: "IF = 8 × n' × S'c (linhas não blindadas)",
      norma: "ABNT NBR 5419-3:2026, Anexo B, B.4-b)",
      substituicao: `IF = 8 × ${nLinhas} × ${ScCadaUm} = ${value.toFixed(2)} kA`,
    };
  }

  /* ==========================================================================
     resolverKc — resolução centralizada do coeficiente kc a partir do objeto
     dimensionamento (a.dimensionamento), seguindo exatamente a mesma lógica
     de seleção de caso usada em M_DimensionamentoSPDA.calcularEExibirKcS().
     Extraída para cá para permitir reuso por outros módulos (ex.: M_MPS,
     Anexo A.4 da Parte 4) sem duplicar a lógica de seleção de caso de kc.
     Retorna null se os dados ainda forem insuficientes para resolver kc.
     ========================================================================== */
  function resolverKc(d) {
    if (!d) return null;
    const h = parseFloat(d.kcH), c = parseFloat(d.kcC), n = parseInt(d.kcN);
    if (d.casoKc === "1") return calc_kc_umaDescida();
    if (d.casoKc === "2" && h && c) return calc_kc_duasDescidas(h, c);
    if (d.casoKc === "3central" && h && c) return calc_kc_tresDescidasCentral(h, c);
    if (d.casoKc === "multiplas" && h && c && n) return calc_kc_multiplasDescidas(n, c, h);
    if (d.casoKc === "tabela13" && n) return tabela13_kc(n);
    if (d.casoKc === "manual" && d.kcManual) {
      return { value: parseFloat(d.kcManual), formula: "kc informado manualmente", norma: "Procedimento gráfico do Anexo C (Fig. C.6, C.8 ou C.9) aplicado externamente" };
    }
    return null;
  }

  return {
    tabelas: {
      TABELA2_NP,
      TABELA5_DIST_DESCIDA,
      TABELA11_KI,
      TABELA12_KM,
      TABELA3_ESPESSURAS,
      TABELA7_CONDUTORES,
      TABELA8_ELETRODOS,
      TABELA9_EQUIPOTENCIAL_BARRAS,
      TABELA10_EQUIPOTENCIAL_INTERNAS,
    },
    tabela13_kc,
    calc_anguloProtecao,
    calc_comprimentoMinEletrodo,
    calc_raioEquivalenteEletrodo,
    calc_dispensaComplementacao,
    calc_eletrodoComplementar,
    calc_numeroMinDescidas,
    calc_espacamentoReal,
    calc_kc_umaDescida,
    calc_kc_duasDescidas,
    calc_kc_tresDescidasCentral,
    calc_kc_multiplasDescidas,
    calc_distanciaSeguranca_simplificada,
    calc_distanciaSeguranca_completa,
    calc_secaoMinBlindagem,
    calc_comprimentoLinhaBlindagem_aterrada,
    calc_correnteLimiteBlindagemCobre,
    calc_correnteLimiteCondutoresNaoBlindados,
    resolverKc,
  };
})();

  /* C.2.1.9 — verificação das 4 condições de proteção adequada do equipamento.

      id: "a",
      descricao: "Up/f ≤ Uw — comprimento do circuito entre o DPS e o equipamento desprezável",
      norma: "ABNT NBR 5419-4:2026, C.2.1.9-a)",
      aplicavel: condA_aplicavel,
      atendida: condA_aplicavel && condA_atendida,
      limite: Uw,
      detalhe: `Up/f (${UpF.toFixed(3)} kV) ${condA_atendida ? "≤" : ">"} Uw (${Uw} kV)`,
    });

    const limiteB = 0.8 * Uw;
    const condB_aplicavel = comprimentoCircuitoM !== null && comprimentoCircuitoM !== undefined && comprimentoCircuitoM <= 10;
    const condB_atendida = UpF <= limiteB;

      id: "b",
      descricao: "Up/f ≤ 0,8 × Uw — comprimento do circuito não maior que 10 m",
      norma: "ABNT NBR 5419-4:2026, C.2.1.9-b)",
      aplicavel: condB_aplicavel,
      atendida: condB_aplicavel && condB_atendida,
      limite: limiteB,
      detalhe: `Up/f (${UpF.toFixed(3)} kV) ${condB_atendida ? "≤" : ">"} 0,8×Uw (${limiteB.toFixed(3)} kV)`,
    });

    const limiteC = 0.5 * Uw;
    const condC_aplicavel = comprimentoCircuitoM !== null && comprimentoCircuitoM !== undefined && comprimentoCircuitoM <= 10 && !!sistemaCritico;
    const condC_atendida = UpF <= limiteC;

      id: "c",
      descricao: "Up/f ≤ 0,5 × Uw — comprimento ≤ 10 m e falha do sistema interno crítica (conforme NBR 5419-2)",
      norma: "ABNT NBR 5419-4:2026, C.2.1.9-c)",
      aplicavel: condC_aplicavel,
      atendida: condC_aplicavel && condC_atendida,
      limite: limiteC,
      detalhe: sistemaCritico
        ? `Up/f (${UpF.toFixed(3)} kV) ${condC_atendida ? "≤" : ">"} 0,5×Uw (${limiteC.toFixed(3)} kV)`
        : "Não aplicável — sistema não indicado como crítico.",
    });

    const condD_aplicavel = comprimentoCircuitoM !== null && comprimentoCircuitoM !== undefined && comprimentoCircuitoM > 10;
    condicoes.push({
      id: "d",
      descricao: "Distância > 10 m ou Up baixo o suficiente indisponível — medidas alternativas (DPS adicional próximo ao equipamento, ou DPS de duas portas com cabeamento blindado/roteamento conjunto)",
      norma: "ABNT NBR 5419-4:2026, C.2.1.9-d)",
      aplicavel: condD_aplicavel,
      atendida: false, // condição "d" não é uma verificação numérica — é uma medida alternativa a adotar
      limite: null,
      detalhe: condD_aplicavel
        ? "Comprimento do circuito superior a 10 m — adotar medida alternativa conforme C.2.1.9-d)."
        : "Não aplicável — comprimento do circuito não excede 10 m.",
    });

    const algumaAtendida = condicoes.some((c) => c.atendida);
    const condicaoAplicavelAtendida = condicoes.find((c) => c.aplicavel && c.atendida);

    return {
      protegido: algumaAtendida,
      condicaoSatisfeita: condicaoAplicavelAtendida ? condicaoAplicavelAtendida.id : null,
      condicoes,
      norma: "ABNT NBR 5419-4:2026, C.2.1.9",

  }

  function calc_UOC_max_impactoDireto(NP, componente, b, l, dl_w, dl_r, wm, kh) {

    if (componente === "F") { I0max = p.IF_MAX; T1 = p.T1_F; label = "primeira componente positiva"; eqNum = "A.27"; }
    else if (componente === "FN") { I0max = p.IFN_MAX; T1 = p.T1_FN; label = "primeira componente negativa"; eqNum = "A.29"; }
    else if (componente === "S") { I0max = p.IS_MAX; T1 = p.T1_S; label = "componentes subsequentes"; eqNum = "A.31"; }
    else return null;

    // I0max em kA, T1 em µs -> ajusta unidades para V: I0max[A] / T1[s]
    const I0max_A = I0max * 1e3;
    const T1_s = T1 * 1e-6;
    const value = mu0 * b * Math.log(1 + l / dl_w) * kh * (wm / Math.sqrt(dl_r)) * (I0max_A / T1_s);
    return {
      value,
      formula: "Uoc/máx = μ0×b×ln(1+l/dl/w)×kh×(wm/√dl/r)×I0/máx/T1",
      norma: `ABNT NBR 5419-4:2026, A.5.2.3, Equação (A.23) — forma geral, válida para ${label}`,
      substituicao: `Uoc/máx = 4π×10⁻⁷ × ${b} × ln(1+${l}/${dl_w}) × ${kh} × (${wm}/√${dl_r}) × ${I0max_A.toExponential(2)} A / ${T1_s.toExponential(2)} s = ${value.toFixed(1)} V (NP ${NP}, ${label})`,
      I0max, T1, b, l, dl_w, dl_r, wm, kh, componente,
    };
  }

  /* Versões simplificadas por componente — equações A.27/A.29/A.31 (coeficiente numérico
     já embute μ0 e T1 padrão de cada componente, conforme texto literal da norma) */
  function calc_UOC_max_F(b, l, dl_w, dl_r, wm, IF_MAX_kA) {
    const value = 1.26 * b * Math.log(1 + l / dl_w) * (wm / Math.sqrt(dl_r)) * IF_MAX_kA;
    return {
      value,
      formula: "Uoc/F/máx = 1,26 × b × ln(1+l/dl/w) × (wm/√dl/r) × IF/máx (V)",
      norma: "ABNT NBR 5419-4:2026, A.5.2.7, Equação (A.27)",
      substituicao: `Uoc/F/máx = 1,26 × ${b} × ln(1+${l}/${dl_w}) × (${wm}/√${dl_r}) × ${IF_MAX_kA} = ${value.toFixed(1)} V`,
      b, l, dl_w, dl_r, wm, IF_MAX_kA,
    };
  }

  function calc_ISC_max_F(b, l, dl_w, dl_r, wm, IF_MAX_kA, LS) {
    const value = 12.6e-6 * b * Math.log(1 + l / dl_w) * (wm / Math.sqrt(dl_r)) * IF_MAX_kA / LS;
    return {
      value,
      formula: "Isc/F/máx = 12,6×10⁻⁶ × b × ln(1+l/dl/w) × (wm/√dl/r) × IF/máx / Ls (A)",
      norma: "ABNT NBR 5419-4:2026, A.5.2.7, Equação (A.28)",
      substituicao: `Isc/F/máx = 12,6×10⁻⁶ × ${b} × ln(1+${l}/${dl_w}) × (${wm}/√${dl_r}) × ${IF_MAX_kA} / ${LS.toExponential(3)} = ${value.toFixed(2)} A`,
      b, l, dl_w, dl_r, wm, IF_MAX_kA, LS,
    };
  }

  function calc_UOC_max_FN(b, l, dl_w, dl_r, wm, IFN_MAX_kA) {
    const value = 12.6 * b * Math.log(1 + l / dl_w) * (wm / Math.sqrt(dl_r)) * IFN_MAX_kA;
    return {
      value,
      formula: "Uoc/FN/máx = 12,6 × b × ln(1+l/dl/w) × (wm/√dl/r) × IFN/máx (V)",
      norma: "ABNT NBR 5419-4:2026, A.5.2.8, Equação (A.29)",
      substituicao: `Uoc/FN/máx = 12,6 × ${b} × ln(1+${l}/${dl_w}) × (${wm}/√${dl_r}) × ${IFN_MAX_kA} = ${value.toFixed(1)} V`,
      b, l, dl_w, dl_r, wm, IFN_MAX_kA,
    };
  }

  function calc_ISC_max_FN(b, l, dl_w, dl_r, wm, IFN_MAX_kA, LS) {
    const value = 12.6e-6 * b * Math.log(1 + l / dl_w) * (wm / Math.sqrt(dl_r)) * IFN_MAX_kA / LS;
    return {
      value,
      formula: "Isc/FN/máx = 12,6×10⁻⁶ × b × ln(1+l/dl/w) × (wm/√dl/r) × IFN/máx / Ls (A)",
      norma: "ABNT NBR 5419-4:2026, A.5.2.8, Equação (A.30)",
      substituicao: `Isc/FN/máx = 12,6×10⁻⁶ × ${b} × ln(1+${l}/${dl_w}) × (${wm}/√${dl_r}) × ${IFN_MAX_kA} / ${LS.toExponential(3)} = ${value.toFixed(2)} A`,
      b, l, dl_w, dl_r, wm, IFN_MAX_kA, LS,
    };
  }

  function calc_UOC_max_S(b, l, dl_w, dl_r, wm, IS_MAX_kA) {
    const value = 50.4 * b * Math.log(1 + l / dl_w) * (wm / Math.sqrt(dl_r)) * IS_MAX_kA;
    return {
      value,
      formula: "Uoc/S/máx = 50,4 × b × ln(1+l/dl/w) × (wm/√dl/r) × IS/máx (V)",
      norma: "ABNT NBR 5419-4:2026, A.5.2.9, Equação (A.31)",
      substituicao: `Uoc/S/máx = 50,4 × ${b} × ln(1+${l}/${dl_w}) × (${wm}/√${dl_r}) × ${IS_MAX_kA} = ${value.toFixed(1)} V`,
      b, l, dl_w, dl_r, wm, IS_MAX_kA,
    };
  }

  function calc_ISC_max_S(b, l, dl_w, dl_r, wm, IS_MAX_kA, LS) {
    const value = 12.6e-6 * b * Math.log(1 + l / dl_w) * (wm / Math.sqrt(dl_r)) * IS_MAX_kA / LS;
    return {
      value,
      formula: "Isc/S/máx = 12,6×10⁻⁶ × b × ln(1+l/dl/w) × (wm/√dl/r) × IS/máx / Ls (A)",
      norma: "ABNT NBR 5419-4:2026, A.5.2.9, Equação (A.32)",
      substituicao: `Isc/S/máx = 12,6×10⁻⁶ × ${b} × ln(1+${l}/${dl_w}) × (${wm}/√${dl_r}) × ${IS_MAX_kA} / ${LS.toExponential(3)} = ${value.toFixed(2)} A`,
      b, l, dl_w, dl_r, wm, IS_MAX_kA, LS,
    };
  }

  /* ---------- A.5.3 — situação dentro de ZPR 1, impacto próximo (campo homogêneo H1) ---------- */

  function calc_UOC_max_homogeneo(b, l, H1_componente_max, coefByComponente) {
    // coefByComponente: 0.126 (F), 1.26 (FN), 5.04 (S) — conforme A.37/A.39/A.41
    const value = coefByComponente * b * l * H1_componente_max;
    return { value, b, l, H1_componente_max, coefByComponente };
  }

  function calc_UOC_max_F_homogeneo(b, l, H1_F_max) {
    const value = 0.126 * b * l * H1_F_max;
    return {
      value,
      formula: "Uoc/F/máx = 0,126 × b × l × H1/F/máx (V)",
      norma: "ABNT NBR 5419-4:2026, A.5.3-e), Equação (A.37)",
      substituicao: `Uoc/F/máx = 0,126 × ${b} × ${l} × ${H1_F_max.toFixed(4)} = ${value.toFixed(2)} V`,
      b, l, H1_F_max,
    };
  }

  function calc_ISC_max_F_homogeneo(b, l, H1_F_max, LS) {
    const value = 1.26e-6 * b * l * H1_F_max / LS;
    return {
      value,
      formula: "Isc/F/máx = 1,26×10⁻⁶ × b × l × H1/F/máx / Ls (A)",
      norma: "ABNT NBR 5419-4:2026, A.5.3-e), Equação (A.38)",
      substituicao: `Isc/F/máx = 1,26×10⁻⁶ × ${b} × ${l} × ${H1_F_max.toFixed(4)} / ${LS.toExponential(3)} = ${value.toFixed(4)} A`,
      b, l, H1_F_max, LS,
    };
  }

  function calc_UOC_max_FN_homogeneo(b, l, H1_FN_max) {
    const value = 1.26 * b * l * H1_FN_max;
    return {
      value,
      formula: "Uoc/FN/máx = 1,26 × b × l × H1/FN/máx (V)",
      norma: "ABNT NBR 5419-4:2026, A.5.3-f), Equação (A.39)",
      substituicao: `Uoc/FN/máx = 1,26 × ${b} × ${l} × ${H1_FN_max.toFixed(4)} = ${value.toFixed(2)} V`,
      b, l, H1_FN_max,
    };
  }

  function calc_ISC_max_FN_homogeneo(b, l, H1_FN_max, LS) {
    const value = 1.26e-6 * b * l * H1_FN_max / LS;
    return {
      value,
      formula: "Isc/FN/máx = 1,26×10⁻⁶ × b × l × H1/FN/máx / Ls (A)",
      norma: "ABNT NBR 5419-4:2026, A.5.3-f), Equação (A.40)",
      substituicao: `Isc/FN/máx = 1,26×10⁻⁶ × ${b} × ${l} × ${H1_FN_max.toFixed(4)} / ${LS.toExponential(3)} = ${value.toFixed(4)} A`,
      b, l, H1_FN_max, LS,
    };
  }

  function calc_UOC_max_S_homogeneo(b, l, H1_S_max) {
    const value = 5.04 * b * l * H1_S_max;
    return {
      value,
      formula: "Uoc/S/máx = 5,04 × b × l × H1/S/máx (V)",
      norma: "ABNT NBR 5419-4:2026, A.5.3-g), Equação (A.41)",
      substituicao: `Uoc/S/máx = 5,04 × ${b} × ${l} × ${H1_S_max.toFixed(4)} = ${value.toFixed(2)} V`,
      b, l, H1_S_max,
    };
  }

  function calc_ISC_max_S_homogeneo(b, l, H1_S_max, LS) {
    const value = 1.26e-6 * b * l * H1_S_max / LS;
    return {
      value,
      formula: "Isc/S/máx = 1,26×10⁻⁶ × b × l × H1/S/máx / Ls (A)",
      norma: "ABNT NBR 5419-4:2026, A.5.3-g), Equação (A.42)",
      substituicao: `Isc/S/máx = 1,26×10⁻⁶ × ${b} × ${l} × ${H1_S_max.toFixed(4)} / ${LS.toExponential(3)} = ${value.toFixed(4)} A`,
      b, l, H1_S_max, LS,
    };
  }

  /* A.5.4 — ZPR 2 e mais altas: mesma equação de A.5.3 (impacto próximo,
     campo homogêneo), substituindo H1 por Hn. Reaproveita as funções acima
     com o valor de Hn calculado via calc_Hn1_deZPRn(). */

  return {
    TABELA3_PARTE1,
    normalizarNP,
    parametrosNP,
    calc_SF_planaCobreAluminio,
    calc_SF_planaAco,
    calc_H1_impactoDireto,
    aplicarReducaoMalhaEquipotencial,
    calc_ds1,
    calc_H0_impactoProximo,
    calc_H1_atenuado_deH0,
    calc_ds2,
    calc_sa,
    calc_Hn1_deZPRn,
    calc_LS_laco,
    calc_UOC_max_impactoDireto,
    calc_UOC_max_F,
    calc_ISC_max_F,
    calc_UOC_max_FN,
    calc_ISC_max_FN,
    calc_UOC_max_S,
    calc_ISC_max_S,
    calc_UOC_max_F_homogeneo,
    calc_ISC_max_F_homogeneo,
    calc_UOC_max_FN_homogeneo,
    calc_ISC_max_FN_homogeneo,
    calc_UOC_max_S_homogeneo,
    calc_ISC_max_S_homogeneo,
  };
})();

/* ==========================================================================
   NEMAX_CALC_R4 — Motor de cálculo, ABNT NBR 5419-2:2026, Anexo D
   Risco de perda de valor econômico (R4) e avaliação do custo da
   eficiência da proteção (D.2).

   Conforme D.1.1, R4 é informativo e opcional — não substitui nem altera
   R1/R3 (que continuam sendo os critérios normativos de necessidade de
   proteção). Reaproveita os mesmos N (eventos perigosos) e P (probabilidades)
   já calculados pelo motor de risco principal (Calculo.executar), evitando
   duplicar lógica — a única peça nova é a perda L4 (Tabela D.1), que depende
   de valores monetários informados pelo usuário, e o workflow de
   custo-benefício (D.2).

   Padrão de retorno idêntico aos demais motores do sistema:
     { value, formula, norma, substituicao, ...termos }

   Toda fórmula, tabela e item normativo foi conferido diretamente contra o
   texto da ABNT NBR 5419-2:2026, Anexo D (D.1 a D.12), incluindo a Tabela D.1
   (fórmulas de perda L4) e a Tabela D.2 (valores típicos de LT/LF/LO para
   perda L4 — distinta da Tabela C.2, usada para L1).
   ========================================================================== */

const NEMAX_CALC_R4 = (function () {
  "use strict";

  /* ==========================================================================
     TABELA D.2 — Valores médios típicos de LT, LF, LO para perda L4
     Norma: D.3.1, Tabela D.2
     (Distinta da Tabela C.2, usada para a perda L1 — mesmo nome de variável,
     valores e categorias diferentes.)
     ========================================================================== */
  const TABELA_D2_L4 = {
    LT: [
      { label: "Todos os tipos em que somente animais estão presentes", value: 1e-2 },
    ],
    LF: [
      { label: "Risco de explosão", value: 1 },
      { label: "Hospital, industrial, museu, agricultura", value: 0.5 },
      { label: "Hotel, escola, escritório, igreja, entretenimento público, comercial", value: 0.2 },
      { label: "Outros", value: 1e-1 },
    ],
    LO: [
      { label: "Risco de explosão", value: 1e-1 },
      { label: "Hospital, industrial, escritório, hotel, comercial", value: 1e-2 },
      { label: "Museu, agricultura, escola, igreja, entretenimento público", value: 1e-3 },
      { label: "Outros", value: 1e-4 },
    ],
  };

  /* ==========================================================================
     TABELA D.1 — Tipo de perda L4: fórmulas de perda de cada zona
     Norma: D.3.1, Tabela D.1, Equações (D.1)-(D.4)

     Nota normativa (Tabela D.1, nota 'a'): as relações ca/ct,
     (ca+cb+cc+cs)/ct e cs/ct só são consideradas se a análise de risco for
     conduzida com valores monetários reais por zona de estudo. Caso se
     utilize o valor representativo de RT=10⁻³ (D.1.2), as relações devem
     ser substituídas por 1 — implementado aqui como modo "simplificado".
     ========================================================================== */

  // Eq. (D.1)/(D.2): LA = LU = rt × LT × ca/ct
  function calc_LA4_LU4(rt, LT, ca, ct, modoSimplificado) {
    const razao = modoSimplificado ? 1 : (ct > 0 ? ca / ct : 0);
    const value = rt * LT * razao;
    return {
      value,
      formula: "L_A4 (L_U4) = r_t × L_T × c_a/c_t",
      norma: "ABNT NBR 5419-2:2026, D.3.1, Tabela D.1, Eq. (D.1)/(D.2)",
      substituicao: modoSimplificado
        ? `L_A4 = ${rt} × ${LT} × 1 (modo simplificado, relação=1) = ${value.toExponential(4)}`
        : `L_A4 = ${rt} × ${LT} × (${ca}/${ct}) = ${value.toExponential(4)}`,
      rt, LT, ca, ct, modoSimplificado,
    };
  }

  // Eq. (D.3): LB = LV = rp × rf × LF × (ca+cb+cc+cs)/ct
  function calc_LB4_LV4(rp, rf, LF, ca, cb, cc, cs, ct, modoSimplificado) {
    const soma = ca + cb + cc + cs;
    const razao = modoSimplificado ? 1 : (ct > 0 ? soma / ct : 0);
    const value = rp * rf * LF * razao;
    return {
      value,
      formula: "L_B4 (L_V4) = r_p × r_f × L_F × (c_a+c_b+c_c+c_s)/c_t",
      norma: "ABNT NBR 5419-2:2026, D.3.1, Tabela D.1, Eq. (D.3)",
      substituicao: modoSimplificado
        ? `L_B4 = ${rp} × ${rf} × ${LF} × 1 (modo simplificado, relação=1) = ${value.toExponential(4)}`
        : `L_B4 = ${rp} × ${rf} × ${LF} × (${soma}/${ct}) = ${value.toExponential(4)}`,
      rp, rf, LF, ca, cb, cc, cs, ct, modoSimplificado,
    };
  }

  // Eq. (D.4): LC = LM = LW = LZ = LO × cs/ct
  function calc_LC4_LM4_LW4_LZ4(LO, cs, ct, modoSimplificado) {
    const razao = modoSimplificado ? 1 : (ct > 0 ? cs / ct : 0);
    const value = LO * razao;
    return {
      value,
      formula: "L_C4 (L_M4, L_W4, L_Z4) = L_O × c_s/c_t",
      norma: "ABNT NBR 5419-2:2026, D.3.1, Tabela D.1, Eq. (D.4)",
      substituicao: modoSimplificado
        ? `L_C4 = ${LO} × 1 (modo simplificado, relação=1) = ${value.toExponential(4)}`
        : `L_C4 = ${LO} × (${cs}/${ct}) = ${value.toExponential(4)}`,
      LO, cs, ct, modoSimplificado,
    };
  }

  /* ==========================================================================
     D.1.4 — R4 = RA4* + RB4 + RC4 + RM4 + RU4* + RV4 + RW4 + RZ4
     (* somente para propriedades onde animais com valor comercial devam ser
     considerados — RA4 e RU4 exigidos só se houver ca > 0)

     Reaproveita calc_R (N × P × L) já existente no motor principal — aqui
     reimplementado localmente de forma idêntica para manter o módulo
     autocontido e testável isoladamente.
     ========================================================================== */
  function calc_R4_componente(N, P, L4, nome, eq) {
    const value = N * P * L4;
    return {
      value,
      formula: `${nome} = N × P × L4`,
      norma: `ABNT NBR 5419-2:2026, D.1.4, ${eq}`,
      substituicao: `${nome} = ${N.toExponential(4)} × ${P.toExponential(4)} × ${L4.toExponential(4)} = ${value.toExponential(4)} /ano`,
    };
  }

  /* Soma final de R4, com regra de inclusão condicional de RA4/RU4 (animais) */
  function calc_R4_total(componentes) {
    // componentes: { RA4, RB4, RC4, RM4, RU4, RV4, RW4, RZ4 } — cada um
    // pode ser null se a fonte de dano correspondente (S1-S4) não estiver
    // ativa, ou (para RA4/RU4) se não houver valor de animais informado.
    let total = 0;
    const parcelas = [];
    for (const [nome, comp] of Object.entries(componentes)) {
      if (comp && typeof comp.value === "number") {
        total += comp.value;
        parcelas.push(`${nome}=${comp.value.toExponential(4)}`);
      }
    }
    return {
      value: total,
      formula: "R4 = RA4* + RB4 + RC4 + RM4 + RU4* + RV4 + RW4 + RZ4",
      norma: "ABNT NBR 5419-2:2026, D.1.4",
      substituicao: `R4 = ${parcelas.join(" + ")} = ${total.toExponential(4)} /ano`,
    };
  }

  /* ==========================================================================
     D.1.2 — Risco tolerável representativo RT4 = 10⁻³ (não normalizado,
     valor representativo sugerido pela norma)
     ========================================================================== */
  const RT4_REPRESENTATIVO = 1e-3;

  /* ==========================================================================
     D.2 — AVALIAÇÃO DO CUSTO DA EFICIÊNCIA DA PROTEÇÃO
     Equações (D.7) a (D.12)
     ========================================================================== */

  // Eq. (D.8): CL = R4 × ct (custo total de perdas SEM medidas de proteção)
  function calc_CL(R4_sem, ct) {
    const value = R4_sem * ct;
    return {
      value,
      formula: "CL = R4 × ct",
      norma: "ABNT NBR 5419-2:2026, D.4, Eq. (D.8)",
      substituicao: `CL = ${R4_sem.toExponential(4)} × ${ct} = ${value.toFixed(2)}`,
      R4_sem, ct,
    };
  }

  // Eq. (D.10): CRL = R'4 × ct (custo total de perdas residuais COM proteção)
  function calc_CRL(R4_com, ct) {
    const value = R4_com * ct;
    return {
      value,
      formula: "CRL = R'4 × ct",
      norma: "ABNT NBR 5419-2:2026, D.4, Eq. (D.10)",
      substituicao: `CRL = ${R4_com.toExponential(4)} × ${ct} = ${value.toFixed(2)}`,
      R4_com, ct,
    };
  }

  // Eq. (D.11): CPM = CP × (i + a + m)
  function calc_CPM(CP, i, a, m) {
    const value = CP * (i + a + m);
    return {
      value,
      formula: "CPM = CP × (i + a + m)",
      norma: "ABNT NBR 5419-2:2026, D.4, Eq. (D.11)",
      substituicao: `CPM = ${CP} × (${i} + ${a} + ${m}) = ${CP} × ${(i + a + m).toFixed(4)} = ${value.toFixed(2)}`,
      CP, i, a, m,
    };
  }

  // Eq. (D.12): SM = CL - (CPM + CRL)
  function calc_SM(CL, CPM, CRL) {
    const value = CL - (CPM + CRL);
    return {
      value,
      formula: "SM = CL - (CPM + CRL)",
      norma: "ABNT NBR 5419-2:2026, D.4, Eq. (D.12)",
      substituicao: `SM = ${CL.toFixed(2)} - (${CPM.toFixed(2)} + ${CRL.toFixed(2)}) = ${value.toFixed(2)}`,
      justificado: value > 0,
      CL, CPM, CRL,
    };
  }

  /* D.2.3/D.2.4 — interpretação direta da comparação de custos (sem usar SM,
     para os casos em que se quer apenas o parecer qualitativo) */
  function avaliarJustificativaCusto(CL, CRL, CPM) {
    const justificado = CL >= CRL + CPM;
    return {
      justificado,
      norma: justificado ? "ABNT NBR 5419-2:2026, D.2.4" : "ABNT NBR 5419-2:2026, D.2.3",
      mensagem: justificado
        ? `CL (${CL.toFixed(2)}) ≥ CRL + CPM (${(CRL + CPM).toFixed(2)}) — sob o ponto de vista econômico, o custo envolvido na adoção da proteção é justificado (D.2.4).`
        : `CL (${CL.toFixed(2)}) < CRL + CPM (${(CRL + CPM).toFixed(2)}) — sob o ponto de vista econômico, o custo envolvido na adoção da proteção não é justificado (D.2.3).`,
    };
  }

  return {
    TABELA_D2_L4,
    RT4_REPRESENTATIVO,
    calc_LA4_LU4,
    calc_LB4_LV4,

})();

<script>
/* ============================================================
   APLICAÇÃO NEMAX — estado, navegação, persistência

/* ============================================================
   APLICAÇÃO NEMAX — Sistema de Análise de Risco PDA
   ABNT NBR 5419-2:2026

const STORAGE_KEY = "nemax_analises_v1";
const CONFIG_KEY = "nemax_config_v1";

function uid() {
  return "an_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
}

function nowISO() {
  return new Date().toISOString();
}

function fmtData(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function fmtNum(n, digits) {
  digits = digits === undefined ? 2 : digits;
  if (n === undefined || n === null || isNaN(n)) return "—";
  if (n === 0) return "0";
  return n.toExponential(digits).replace("e", " × 10");
}

function fmtRazao(n) {
  if (n === undefined || n === null || isNaN(n)) return "—";
  return n.toFixed(2) + "×";
}

/* ============== PERSISTÊNCIA ============== */

function getConfig() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    empresa: "NEMAX Engenharia",
    responsavelTecnico: "Giuseppe Maset Neto",
    crea: "CREA-PR 138473/D — visto SP",
    art: "",
    email: "contato@nemaxengenharia.com.br",
    telefone: "(19) 99651-3143",
    endereco: "Ribeirão Preto - SP / São José do Rio Preto — SP / Pirasununga - SP",
  };
}

function saveConfig(cfg) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

function getAnalises() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}

function saveAnalises(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function salvarAnalise(analise) {
  const list = getAnalises();
  const idx = list.findIndex((a) => a.id === analise.id);
  analise.atualizadoEm = nowISO();
  if (!analise.auditoria) analise.auditoria = [];
  analise.auditoria.push({ data: nowISO(), acao: idx === -1 ? "Criada" : "Atualizada", versao: analise.auditoria.length + 1 });
  if (idx === -1) {
    list.push(analise);
  } else {
    list[idx] = analise;
  }
  saveAnalises(list);
}

function excluirAnalise(id) {
  const list = getAnalises().filter((a) => a.id !== id);
  saveAnalises(list);
}

function duplicarAnalise(id) {
  const list = getAnalises();
  const original = list.find((a) => a.id === id);
  if (!original) return null;
  const copia = JSON.parse(JSON.stringify(original));
  copia.id = uid();
  copia.criadoEm = nowISO();
  copia.atualizadoEm = nowISO();
  copia.auditoria = [{ data: nowISO(), acao: "Duplicada a partir de " + id, versao: 1 }];
  if (copia.identificacao) copia.identificacao.numeroLaudo = "";
  list.push(copia);
  saveAnalises(list);
  return copia;
}

    },

}

function novoEstadoEconomico() {

}

/* ============== APP — ROTEAMENTO ============== */

const App = (function () {
  let currentAnalise = null;
  let currentRoute = "dashboard";
  let currentModulo = 0;

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2400);
  }

  function setActiveNav(id) {
    document.querySelectorAll(".topbar-nav button").forEach((b) => b.classList.remove("active"));
    const el = document.getElementById(id);
    if (el) el.classList.add("active");
  }

  function goDashboard() {
    currentRoute = "dashboard";
    setActiveNav("nav-dashboard");
    render();
  }

  function novaAnalise() {
    currentAnalise = novoEstadoAnalise();
    currentRoute = "wizard";
    currentModulo = 0;
    setActiveNav("nav-nova");
    render();
  }

  function abrirAnalise(id) {
    const list = getAnalises();
    const a = list.find((x) => x.id === id);
    if (!a) return showToast("Análise não encontrada.");
    currentAnalise = a;
    currentRoute = "wizard";
    currentModulo = 0;
    render();
  }

  function goHistorico() {
    currentRoute = "historico";
    setActiveNav("nav-historico");
    render();
  }

  function goConfig() {
    currentRoute = "config";
    setActiveNav("nav-config");
    render();
  }

  function irParaModulo(idx) {
    currentModulo = idx;
    render();
  }

  function render() {
    const wrap = document.getElementById("app-wrap");
    if (currentRoute === "dashboard") {
      wrap.innerHTML = Views.dashboard();
    } else if (currentRoute === "historico") {
      wrap.innerHTML = Views.historico();
    } else if (currentRoute === "config") {
      wrap.innerHTML = Views.config();
    } else if (currentRoute === "wizard") {
      wrap.innerHTML = Views.wizard(currentAnalise, currentModulo);
      Wizard.bindModulo(currentAnalise, currentModulo);
    }
  }

  return {
    showToast, goDashboard, novaAnalise, abrirAnalise, goHistorico, goConfig, irParaModulo, render,

    setCurrentAnalise: (a) => { currentAnalise = a; },
    getCurrentModulo: () => currentModulo,
  };
})();


/* ============================================================
   VIEWS — Dashboard, Histórico, Configurações
   ============================================================ */

        </div>
      </div>

      <div class="dash-stats">
        <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">Análises realizadas</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--ok)">${aprovadas}</div><div class="stat-label">Dentro do risco tolerável</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--fail)">${reprovadas}</div><div class="stat-label">Acima do risco tolerável</div></div>
        <div class="stat-box"><div class="stat-num">${pendentes}</div><div class="stat-label">Em andamento</div></div>

      <div class="section-title">Análises recentes</div>
      ${recentes.length === 0 ? `<div class="hist-table"><div class="hist-empty">Nenhuma análise realizada ainda. Clique em "Nova análise" para começar.</div></div>` : `

          ${recentes.map(rowHist).join("")}
        </tbody>
      </table>`}
    `;
  }

  function rowHist(a) {
    const id = a.identificacao || {};
    const est = a.estrutura || {};
    let pill = `<span class="pill pending">Em andamento</span>`;
    if (a.resultado) {
      pill = a.resultado.conforme
        ? `<span class="pill ok">Dentro do limite</span>`
        : `<span class="pill fail">Acima do limite</span>`;
    }
    return `
      <tr style="cursor:pointer" onclick="App.abrirAnalise('${a.id}')">
        <td><b>${esc(id.cliente) || "(sem nome)"}</b></td>
        <td>${esc(id.cidade)}${id.estado ? "/" + esc(id.estado) : ""}</td>
        <td>${esc(est.tipo)}</td>
        <td>${pill}</td>

          </div>

      </tr>
    `;
  }

  function historico() {

    return `
      <div class="dash-header">
        <div class="dash-title">Histórico de análises</div>

          Importar JSON
          <input type="file" accept="application/json" style="display:none" onchange="HistAction.importar(event)">
        </label>
      </div>
      ${list.length === 0 ? `<div class="hist-table"><div class="hist-empty">Nenhuma análise salva ainda.</div></div>` : `
      <table class="hist-table">
        <thead><tr><th>Cliente</th><th>Endereço</th><th>Tipo</th><th>Laudo nº</th><th>Resultado</th><th>Atualizado</th><th></th></tr></thead>
        <tbody>
          ${list.map((a) => {
            const id = a.identificacao || {};
            const est = a.estrutura || {};
            let pill = `<span class="pill pending">Em andamento</span>`;
            if (a.resultado) {
              pill = a.resultado.conforme ? `<span class="pill ok">Dentro do limite</span>` : `<span class="pill fail">Acima do limite</span>`;
            }
            return `<tr style="cursor:pointer" onclick="App.abrirAnalise('${a.id}')">
              <td><b>${esc(id.cliente) || "(sem nome)"}</b></td>
              <td>${esc(id.cidade)}${id.estado ? "/" + esc(id.estado) : ""}</td>
              <td>${esc(est.tipo)}</td>
              <td>${esc(id.numeroLaudo) || "—"}</td>
              <td>${pill}</td>
              <td>${fmtData(a.atualizadoEm)}</td>
              <td onclick="event.stopPropagation()">
                <div class="row-actions">
                  <button class="icon-btn" onclick="HistAction.duplicar('${a.id}')">Duplicar</button>
                  <button class="icon-btn" onclick="HistAction.exportarUm('${a.id}')">Exportar</button>
                  <button class="icon-btn danger" onclick="HistAction.excluir('${a.id}')">Excluir</button>
                </div>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>`}
    `;
  }

  function config() {
    const cfg = getConfig();
    return `
      <div class="dash-header">

            <div class="field"><label>Telefone / WhatsApp</label><input type="text" id="cfg-tel" value="${esc(cfg.telefone)}"></div>
            <div class="field"><label>Endereço / região de atuação</label><input type="text" id="cfg-end" value="${esc(cfg.endereco)}"></div>
          </div>
        </div>
        <div class="wpanel-footer">
          <span></span>
          <button class="btn btn-primary" onclick="ConfigAction.salvar()">Salvar configurações</button>
        </div>

    `;

  return { dashboard, historico, config };
})();

const HistAction = {
  duplicar(id) {
    const c = duplicarAnalise(id);
    if (c) { App.showToast("Análise duplicada."); App.render(); }
  },
  excluir(id) {
    if (!confirm("Excluir esta análise permanentemente?")) return;
    excluirAnalise(id);
    App.showToast("Análise excluída.");
    App.render();
  },
  exportarUm(id) {
    const a = getAnalises().find((x) => x.id === id);
    if (!a) return;
    downloadJSON(a, `nemax-analise-${id}.json`);
  },
  exportarTudo() {
    downloadJSON(getAnalises(), `nemax-analises-${new Date().toISOString().slice(0,10)}.json`);
  },
  importar(evt) {
    const file = evt.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const data = JSON.parse(e.target.result);
        const list = getAnalises();
        const importadas = Array.isArray(data) ? data : [data];
        importadas.forEach((a) => {
          if (!a.id) a.id = uid();
          const idx = list.findIndex((x) => x.id === a.id);
          if (idx === -1) list.push(a); else list[idx] = a;
        });
        saveAnalises(list);
        App.showToast(`${importadas.length} análise(s) importada(s).`);
        App.render();
      } catch (err) {
        App.showToast("Erro ao importar arquivo JSON.");
      }
    };
    reader.readAsText(file);
  },
};

const ConfigAction = {
  salvar() {
    const cfg = {
      empresa: document.getElementById("cfg-empresa").value,
      responsavelTecnico: document.getElementById("cfg-resp").value,
      crea: document.getElementById("cfg-crea").value,
      email: document.getElementById("cfg-email").value,
      telefone: document.getElementById("cfg-tel").value,
      endereco: document.getElementById("cfg-end").value,
    };
    saveConfig(cfg);
    document.getElementById("empresa-nome-topo").textContent = cfg.empresa;
    App.showToast("Configurações salvas.");
  },
};

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function esc(s) {
  if (s === undefined || s === null) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}


/* ============================================================
   WIZARD — Módulos 1 a 15 da análise de risco
   ============================================================ */

const MODULOS = [
  { id: "identificacao", num: 1, label: "Identificação da edificação" },
  { id: "estrutura", num: 2, label: "Caracterização da estrutura" },
  { id: "atmosferico", num: 3, label: "Dados atmosféricos" },
  { id: "linhas", num: 4, label: "Linhas conectadas" },
  { id: "fontes", num: 5, label: "Fontes de dano (S1–S4)" },
  { id: "protecoes", num: 6, label: "Medidas de proteção" },
  { id: "resultados", num: 7, label: "Resultados e componentes de risco" },
  { id: "dimensionamento", num: 8, label: "Dimensionamento físico do SPDA (NBR 5419-3)" },
  { id: "mps", num: 9, label: "Medidas de Proteção contra Surtos — MPS (NBR 5419-4)" },
  { id: "memoria", num: 10, label: "Memória de cálculo" },
  { id: "relatorio", num: 11, label: "Relatório (PDF)" },
];

const Views_old_wizard = {}; // namespace guard

Views.wizard = function (analise, moduloIdx) {
  const id = analise.identificacao;
  const navItems = MODULOS.map((m, i) => {
    const cls = i === moduloIdx ? "active" : (moduloCompleto(analise, i) ? "done" : "");
    return `<div class="wnav-item ${cls}" onclick="App.irParaModulo(${i})">
      <span class="wnav-num">${i === moduloIdx ? m.num : (moduloCompleto(analise, i) ? "✓" : m.num)}</span>
      <span>${m.label}</span>
    </div>`;
  }).join("");

  return `
    <div style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:18px; font-weight:700; color:var(--navy);">${esc(id.cliente) || "Nova análise"}</div>
        <div style="font-size:12.5px; color:var(--gray-text);">${esc(id.cidade)}${id.estado ? "/" + esc(id.estado) : ""} · ${esc(analise.estrutura.tipo)}</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" onclick="Wizard.salvarESair()">Salvar e sair</button>
        <button class="btn btn-primary" onclick="Wizard.salvarAtual(); App.showToast('Salvo.');">Salvar</button>
      </div>
    </div>
    <div class="wizard-shell">
      <div class="wizard-nav">${navItems}</div>
      <div class="wizard-panel">${Wizard.renderModulo(analise, moduloIdx)}</div>
    </div>
  `;
};

function moduloCompleto(analise, idx) {
  const id = MODULOS[idx].id;
  if (id === "identificacao") return !!analise.identificacao.cliente;
  if (id === "estrutura") return !!analise.estrutura.comprimento;
  if (id === "atmosferico") return !!analise.atmosferico.ng;
  if (id === "resultados") return !!analise.resultado;
  if (id === "dimensionamento") return !!(analise.dimensionamento && analise.dimensionamento.perimetroEstrutura && analise.dimensionamento.resistividadeSolo);
  if (id === "mps") return !!(analise.mps && analise.mps.pontosDPS && analise.mps.pontosDPS.length > 0);
  return false;
}

const Wizard = (function () {
  function renderModulo(analise, idx) {
    const m = MODULOS[idx];
    const body = {
      identificacao: M_Identificacao.render,
      estrutura: M_Estrutura.render,
      atmosferico: M_Atmosferico.render,
      linhas: M_Linhas.render,
      fontes: M_Fontes.render,
      protecoes: M_Protecoes.render,
      resultados: M_Resultados.render,
      dimensionamento: M_DimensionamentoSPDA.render,
      mps: M_MPS.render,
      memoria: M_Memoria.render,
      relatorio: M_Relatorio.render,
    }[m.id](analise);

    const isFirst = idx === 0;
    const isLast = idx === MODULOS.length - 1;

    return `
      <div class="wpanel-header">
        <div class="wpanel-kicker">Módulo ${m.num} de ${MODULOS.length}</div>
        <div class="wpanel-title">${m.label}</div>
      </div>
      <div class="wpanel-body">${body}</div>
      <div class="wpanel-footer">
        <button class="btn btn-secondary" ${isFirst ? "disabled" : ""} onclick="Wizard.salvarAtual(); App.irParaModulo(${idx - 1})">← Anterior</button>
        <button class="btn btn-primary" onclick="Wizard.avancar(${idx})">${isLast ? "Concluir" : "Próximo →"}</button>
      </div>
    `;
  }

  function bindModulo(analise, idx) {
    const m = MODULOS[idx];
    const bindFn = {
      identificacao: M_Identificacao.bind,
      estrutura: M_Estrutura.bind,
      atmosferico: M_Atmosferico.bind,
      linhas: M_Linhas.bind,
      fontes: M_Fontes.bind,
      protecoes: M_Protecoes.bind,
      resultados: M_Resultados.bind,
      dimensionamento: M_DimensionamentoSPDA.bind,
      mps: M_MPS.bind,
      memoria: M_Memoria.bind,
      relatorio: M_Relatorio.bind,
    }[m.id];
    if (bindFn) bindFn(analise);
  }

  function salvarAtual() {
    const analise = App.getCurrentAnalise();
    const idx = App.getCurrentModulo();
    const m = MODULOS[idx];
    const coletarFn = {
      identificacao: M_Identificacao.coletar,
      estrutura: M_Estrutura.coletar,
      atmosferico: M_Atmosferico.coletar,
      linhas: M_Linhas.coletar,
      fontes: M_Fontes.coletar,
      protecoes: M_Protecoes.coletar,
      resultados: () => {},
      dimensionamento: M_DimensionamentoSPDA.coletar,
      mps: M_MPS.coletar,
      memoria: () => {},
      relatorio: () => {},
    }[m.id];
    if (coletarFn) coletarFn(analise);
    salvarAnalise(analise);
  }

  function avancar(idx) {
    salvarAtual();
    if (idx === MODULOS.length - 1) {
      App.showToast("Análise concluída e salva.");
      App.goHistorico();
      return;
    }
    if (MODULOS[idx + 1].id === "resultados" || MODULOS[idx].id === "protecoes") {
      Calculo.executar(App.getCurrentAnalise());
      salvarAnalise(App.getCurrentAnalise());
    }
    App.irParaModulo(idx + 1);
  }

  function salvarESair() {
    salvarAtual();
    App.showToast("Análise salva.");
    App.goHistorico();
  }

  return { renderModulo, bindModulo, salvarAtual, avancar, salvarESair };
})();
